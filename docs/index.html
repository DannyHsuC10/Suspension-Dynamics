<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulate full, half and quarter vehicle suspension dynamics, plot responses and export results.">
  <title>SuspensionDynamicsLab</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header class="masthead">
    <div class="frame header-row">
      <div class="brand"><img src="./favicon.svg" alt="" width="42" height="42"><h1>SuspensionDynamicsLab</h1></div>
      <div class="project-bar" aria-label="Project actions">
        <button type="button" id="new-project">New project</button>
        <button type="button" id="import-project">Import JSON</button>
        <button type="button" id="save-project">Download JSON</button>
        <input id="project-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>
  <main class="frame workspace" id="main">
    <p class="notice" id="status" role="status" aria-live="polite"></p>
    <section id="dynamics-workspace" aria-label="Suspension dynamics workspace"></section>
  </main>
</body>
</html>
