<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inspect suspension geometry, simulate vehicle dynamics, and export engineering data and CAD models.">
  <title>SuspensionDynamicsLab</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <header class="masthead">
    <div class="frame header-row">
      <div class="brand"><img src="./favicon.svg" alt="" width="42" height="42"><h1>SuspensionDynamicsLab</h1></div>
      <div class="project-bar" aria-label="Project actions">
        <button type="button" id="import-project">Import JSON</button>
        <button type="button" id="save-project">Download JSON</button>
        <button type="button" id="open-settings" class="primary">Vehicle settings</button>
        <input id="project-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
  </header>
  <main class="frame workspace" id="main">
    <nav class="tabs" id="pages" aria-label="Workspace views">
      <button type="button" data-page="front" aria-current="page">Front FV</button>
      <button type="button" data-page="rear">Rear FV</button>
      <button type="button" data-page="side">Side View (SV)</button>
      <button type="button" data-page="wheel">Wheel End (WE3D)</button>
      <button type="button" data-page="static">Static Full Car</button>
      <button type="button" class="dynamics-tab" data-page="dynamics">Dynamics</button>
    </nav>
    <p class="notice" id="status" role="status" aria-live="polite"></p>
    <section id="geometry-workspace" class="work-grid" aria-label="Suspension geometry">
      <aside class="panel sidebar" aria-labelledby="pose-title">
        <div class="panel-heading"><h2 id="pose-title">Pose settings</h2><span class="project-name" id="project-name"></span></div>
        <div id="pose-fields" class="stack"></div>
        <details class="detail-section" id="scan-settings"><summary>Sweep settings</summary><div id="sweep-fields" class="stack"></div></details>
        <div class="toggle-list" id="view-toggles">
          <label class="check"><input type="checkbox" id="construction" checked> Construction references</label>
          <label class="check"><input type="checkbox" id="point-labels"> Point labels</label>
        </div>
        <button type="button" id="reset-pose">Reset pose</button>
      </aside>
      <div class="result-grid">
        <section class="panel figure-panel" aria-labelledby="view-title">
          <div class="figure-header">
            <div><h2 id="view-title">Front FV</h2><p id="view-description">Front axle geometry in the lateral plane</p></div>
            <label class="field chart-mode" id="chart-field"><span>Display</span><select id="chart-mode"></select></label>
          </div>
          <div class="plot-toolbar">
            <span id="plot-hint">Drag to pan · Scroll to zoom</span>
            <div class="inline-actions">
              <label class="sr-only" for="projection">Camera projection</label>
              <select id="projection" hidden><option value="iso">Isometric</option><option value="front">Front</option><option value="rear">Rear</option><option value="side">Side</option><option value="top">Top</option></select>
              <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
              <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
              <button type="button" id="reset-camera">Fit view</button>
            </div>
          </div>
          <div class="plot"><canvas id="geometry-plot" tabindex="0" aria-label="Interactive suspension geometry plot"></canvas></div>
          <div class="export-bar">
            <label class="field export-field"><span>Format</span><select id="export-format">
              <option value="state">Current results (.csv)</option><option value="sweep">Sweep data (.csv)</option>
              <option value="points">Hardpoints (.csv)</option><option value="members">Members (.csv)</option>
              <option value="step">CAD model (.step)</option><option value="png">Current plot (.png)</option><option value="json">Current results (.json)</option>
            </select></label>
            <button type="button" id="export-geometry" class="primary">Download</button>
          </div>
        </section>
        <section class="panel data-panel" aria-labelledby="results-title">
          <div class="panel-heading"><h2 id="results-title">Current results</h2><p id="result-caption" class="muted"></p></div>
          <dl id="metrics" class="metrics"></dl>
          <details class="detail-section" id="sample-section"><summary id="sample-title">Sweep data</summary><div class="table-wrap" id="samples"></div></details>
        </section>
      </div>
    </section>
    <section id="dynamics-workspace" hidden aria-label="Vehicle dynamics simulation"></section>
  </main>
  <dialog id="settings" class="dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <header class="dialog-header"><h2 id="settings-title">Vehicle settings</h2><button type="button" id="close-settings" aria-label="Close vehicle settings">×</button></header>
      <div class="dialog-body" id="settings-fields"></div>
      <footer class="dialog-footer"><span class="notice" id="settings-error" role="alert"></span><button type="button" id="reset-settings">Load defaults</button><button type="submit" class="primary">Apply settings</button></footer>
    </form>
  </dialog>
  <dialog id="step-options" class="dialog compact-dialog" aria-labelledby="step-title">
    <form id="step-form">
      <header class="dialog-header"><h2 id="step-title">Export STEP</h2></header>
      <div class="dialog-body stack">
        <label class="field"><span>Member diameter (mm)</span><input name="diameter" type="number" min="0.01" max="1000" step="any" value="20" required></label>
        <label class="field"><span>CAD representation</span><select name="stepMode"><option value="solid">Solid cylinders</option><option value="wireframe">Wireframe</option></select></label>
        <label class="field"><span>Hardpoint marker diameter (mm)</span><input name="joint" type="number" min="0" max="1000" step="any" value="0" required></label>
        <label class="check"><input name="wheels" type="checkbox" checked> Include wheel envelopes</label>
      </div>
      <footer class="dialog-footer"><button id="cancel-step" type="button">Cancel</button><button type="submit" class="primary">Download STEP</button></footer>
    </form>
  </dialog>
</body>
</html>
